<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GDG Hackathon Assistant</title>
  <meta name="description"
    content="AI-powered assistant for GDG on Campus SRMCEM - hackathon prep, community resources, and Google technologies." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Google+Sans:wght@400;500;700&display=swap"
    rel="stylesheet">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: none;
    }

    body {
      font-family: 'Inter', 'Google Sans', system-ui, sans-serif;
      touch-action: manipulation;
      background: #0a0a0a;
    }

    /* Glowing viewport frame */
    .glow-frame {
      box-shadow: inset 0 0 80px rgba(66, 133, 244, 0.08),
        inset 0 0 20px rgba(66, 133, 244, 0.04);
    }

    /* Header glow line */
    .header-glow {
      box-shadow: 0 1px 0 rgba(66, 133, 244, 0.3),
        0 4px 20px rgba(66, 133, 244, 0.08);
    }

    /* Card hover glow */
    .card-glow:hover {
      box-shadow: 0 8px 30px rgba(66, 133, 244, 0.12),
        0 2px 8px rgba(0, 0, 0, 0.06);
    }

    /* Scrollbar */
    .chat-scrollbar::-webkit-scrollbar {
      width: 5px;
    }

    .chat-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }

    .dark .chat-scrollbar::-webkit-scrollbar-thumb {
      background: #334155;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Markdown Preview Styling */
    .markdown-content h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .markdown-content h2 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .markdown-content p {
      margin-bottom: 0.5rem;
    }

    .markdown-content ul {
      list-style-type: disc;
      margin-left: 1.25rem;
      margin-bottom: 0.5rem;
    }

    .markdown-content ol {
      list-style-type: decimal;
      margin-left: 1.25rem;
      margin-bottom: 0.5rem;
    }

    .markdown-content code {
      background-color: rgba(0, 0, 0, 0.08);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9em;
    }

    .dark .markdown-content code {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .markdown-content pre {
      background-color: #1e293b;
      color: #e2e8f0;
      padding: 1rem;
      border-radius: 8px;
      overflow-x: auto;
      margin-bottom: 0.75rem;
    }

    /* Animations */
    @keyframes blob {
      0% {
        transform: translate(0px, 0px) scale(1);
      }

      33% {
        transform: translate(30px, -50px) scale(1.1);
      }

      66% {
        transform: translate(-20px, 20px) scale(0.9);
      }

      100% {
        transform: translate(0px, 0px) scale(1);
      }
    }

    @keyframes glow-pulse {

      0%,
      100% {
        opacity: 0.6;
      }

      50% {
        opacity: 1;
      }
    }

    .animate-blob {
      animation: blob 8s infinite alternate ease-in-out;
    }

    .animate-glow {
      animation: glow-pulse 3s ease-in-out infinite;
    }

    .animation-delay-2000 {
      animation-delay: 2s;
    }

    .animation-delay-4000 {
      animation-delay: 4s;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "marked": "https://esm.sh/marked@^15.0.0",
    "dompurify": "https://esm.sh/dompurify@^3.2.3"
  }
}
</script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="index.tsx"></script>
</body>

</html>
